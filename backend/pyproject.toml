[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sunday-vault-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.40,<3", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3", "tzdata>=2025.1", "python-multipart>=0.0.20"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
